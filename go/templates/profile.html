{{define "profile.html"}}<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロファイル設定 — Kabuly</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
    --text: #e2e8f0; --muted: #8892a4; --accent: #3b82f6;
    --buy: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  .back-btn { color: var(--muted); text-decoration: none; font-size: 1.1rem; }
  .header h1 { font-size: 1.1rem; font-weight: 700; }
  .container { max-width: 480px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 24px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .form-group input[type=number] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 1rem;
  }
  .form-group input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .radio-group { display: flex; flex-direction: column; gap: 10px; }
  .radio-option { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: border-color .15s; }
  .radio-option:hover { border-color: var(--accent); }
  .radio-option input[type=radio] { margin-top: 2px; accent-color: var(--accent); }
  .radio-label { font-size: .9rem; font-weight: 600; }
  .radio-desc { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .btn-save { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn-save:hover { opacity: .85; }
  .toast { display: none; background: var(--buy); color: #fff; text-align: center; padding: 10px; border-radius: 8px; margin-top: 14px; font-size: .875rem; }
</style>
</head>
<body>

<header class="header">
  <a class="back-btn" href="/">←</a>
  <h1>⚙ 投資プロファイル設定</h1>
</header>

<div class="container">
  <div class="card">
    <h2>あなたの投資設定</h2>

    <div class="form-group">
      <label>総資金（円）</label>
      <input type="number" id="totalFunds" value="{{printf "%.0f" .TotalFunds}}" min="0" step="10000">
    </div>

    <div class="form-group">
      <label>1銘柄への最大投資割合（%）</label>
      <input type="number" id="maxPct" value="{{printf "%.0f" .MaxPositionPct}}" min="1" max="100" step="1">
    </div>

    <div class="form-group">
      <label>投資スタイル</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="style" value="conservative" {{if eq .Style "conservative"}}checked{{end}}>
          <div>
            <div class="radio-label">🛡 慎重</div>
            <div class="radio-desc">確信度4以上のみ推奨。推奨額は最大枠の50%。</div>
          </div>
        </label>
        <label class="radio-option">
          <input type="radio" name="style" value="normal" {{if eq .Style "normal"}}checked{{end}}>
          <div>
            <div class="radio-label">⚖ 普通</div>
            <div class="radio-desc">確信度3以上で推奨。推奨額は最大枠の70%。</div>
          </div>
        </label>
        <label class="radio-option">
          <input type="radio" name="style" value="aggressive" {{if eq .Style "aggressive"}}checked{{end}}>
          <div>
            <div class="radio-label">🚀 強気</div>
            <div class="radio-desc">確信度2以上で推奨。推奨額は最大枠の100%。</div>
          </div>
        </label>
      </div>
    </div>

    <button class="btn-save" onclick="saveProfile()">保存する</button>
    <div class="toast" id="toast">✓ 保存しました</div>
  </div>
</div>

<script>
async function saveProfile() {
  const totalFunds = parseFloat(document.getElementById('totalFunds').value);
  const maxPct = parseFloat(document.getElementById('maxPct').value);
  const style = document.querySelector('input[name=style]:checked')?.value;

  if (!style) { alert('投資スタイルを選択してください'); return; }
  if (isNaN(totalFunds) || totalFunds <= 0) { alert('総資金を正しく入力してください'); return; }
  if (isNaN(maxPct) || maxPct <= 0 || maxPct > 100) { alert('最大割合を1〜100の範囲で入力してください'); return; }

  const res = await fetch('/api/profile', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ total_funds: totalFunds, max_position_pct: maxPct, style })
  });

  if (res.ok) {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  } else {
    const e = await res.json();
    alert('Error: ' + e.error);
  }
}
</script>
</body>
</html>{{end}}
