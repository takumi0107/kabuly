[project]
name = "kabuly"
version = "0.1.0"
description = "Personal stock assistant with Claude-powered analysis and LINE notifications"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.102.0",
    "feedparser>=6.0.12",
    "line-bot-sdk>=3.21.0",
    "newsapi-python>=0.2.7",
    "python-dotenv>=1.0.0",
    "ta>=0.11.0",
    "xlrd>=2.0.1",
    "yfinance>=1.0.0",
]

[dependency-groups]
dev = []
